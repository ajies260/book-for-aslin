services:
  - type: web
    name: for-you-books-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run db:migrate && npm --workspace apps/api run db:seed && npm --workspace apps/api run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: LIBRETRANSLATE_URL
        sync: false
      - key: LIBRETRANSLATE_API_KEY
        sync: false
      - key: APP_UPDATE_APK_URL
        sync: false
      - key: APP_UPDATE_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MEMBER1_EMAIL
        sync: false
      - key: MEMBER1_PASSWORD
        sync: false
      - key: MEMBER2_EMAIL
        sync: false
      - key: MEMBER2_PASSWORD
        sync: false
      - key: MEMBER3_EMAIL
        sync: false
      - key: MEMBER3_PASSWORD
        sync: false
      - key: MEMBER4_EMAIL
        sync: false
      - key: MEMBER4_PASSWORD
        sync: false
      - key: MEMBER5_EMAIL
        sync: false
      - key: MEMBER5_PASSWORD
        sync: false
      - key: MEMBER6_EMAIL
        sync: false
      - key: MEMBER6_PASSWORD
        sync: false
